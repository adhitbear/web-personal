<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Interaktif</title>
    
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">

    <style>
        #map {
            height: 1000px;
            width: 100%;
        }
        #restaurant-list {
            margin-top: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
        }
    </style>
</head>

<body class="m-4">
    <div class="container-fluid primary">
        <h2 class="mt-3 text-center">Mapping Virtual Office</h2>

        <div class="row">
            <div id="controls" class="col-3 mb-3">
                <label for="placeType" class="form-label">Pilih Kategori:</label>
                <select id="placeType" class="form-select" onchange="searchPlaces()">
                    <option value="all">-- Pilih Area --</option>
                    <option value="warung">Area Tempat Makan</option>
                    <option value="mall">Area Mall, Pertokoan dan Pusat Perbelanjaan</option>
                    <option value="hotel">Area Kost, Hotel, Apartement</option>
                    <option value="kantor">Area Perkantoran dan Pemerintahan</option>
                </select>
            </div>
            <div class="col-10"></div>
        </div>
        
        <div id="map"></div>

        <h3 class="mt-4 text-center">Daftar Lokasi</h3>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>No</th>
                    <th>Acquire</th>
                    <th>Nama Tempat</th>
                    <th>Alamat</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="5" class="text-center">Silakan pilih kategori untuk menampilkan daftar lokasi.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    
    <script src="js/bootstrap.bundle.min.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAjJaHHVnmRqNfgvWBkOsxqzCYm7Tj9Mgo&callback=initMap&libraries=places"></script>

    <script>
        let map, service
        let markers = []

        function initMap() {
            var lokasi = { lat: -6.182448, lng: 106.829476 }

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 16,
                center: lokasi,
                mapTypeId: "roadmap"
            })

            new google.maps.Marker({
                position: lokasi,
                map: map,
                title: "Wisma Mandiri",
                icon: {
                    url: `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 512 512">
                            <circle cx="256" cy="256" r="256" fill="#09122C"/>
                            <text x="50%" y="50%" font-size="200" fill="white" font-family="Arial" text-anchor="middle" alignment-baseline="middle">
                                🏦
                            </text>
                        </svg>
                    `)}`,
                    scaledSize: new google.maps.Size(30, 30)
                }
            })

            service = new google.maps.places.PlacesService(map)

            map.setOptions({
                styles: [{
                    featureType: "poi",
                    stylers: [{ visibility: "off" }]
                }]
            })
        }

        function fetchAcquisitionStatus(callback) {
            fetch("get_acquisition_status.php")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to fetch from API")
                    }
                    return response.json()
                })
                .then(acquisitionData => {
                    callback(acquisitionData)
                })
                .catch(error => {
                    console.error("API error:", error);
                    console.log("Fetching acquisition data from database...");
                    
                    fetch("get_acquisition_status_from_db.php")
                        .then(response => response.json())
                        .then(acquisitionDataFromDB => {
                            callback(acquisitionDataFromDB)
                        })
                        .catch(dbError => console.error("Error fetching from database:", dbError))
                })
        }

        function searchPlaces() {
            const category = document.getElementById("placeType").value
            const tableBody = document.getElementById("tableBody")

            tableBody.innerHTML = ""
            markers.forEach(marker => marker.setMap(null))
            markers = []

            const categories = {
                warung: ["warung", "restoran", "kafe", "food court"],
                mall: ["mall", "pusat perbelanjaan", "supermarket"],
                hotel: ["hotel", "kost", "apartemen"],
                kantor: ["kantor", "pemerintahan", "gedung kantor"]
            }

            const icons = {
                warung: getFontAwesomeMarker("fa-utensils", "#BE5985"),
                mall: getFontAwesomeMarker("fa-shopping-cart", "#B7B1F2"),
                hotel: getFontAwesomeMarker("fa-bed", "#FF9900"),
                kantor: getFontAwesomeMarker("fa-building", "#3333FF")
            }

            if (!categories[category]) {
                return
            }

            fetchAcquisitionStatus(acquisitionData => {
                let placesData = []
                let processedResults = 0

                function processResults(results, pagination) {
                    if (!results || results.length === 0) return

                    results.forEach((place, index) => {
                        let placeId = place.place_id
                        let isAcquisition = acquisitionData[placeId] || false

                        let marker = new google.maps.Marker({
                            position: place.geometry.location,
                            map: map,
                            title: place.name,
                            icon: {
                                url: icons[category] || "https://maps.google.com/mapfiles/kml/shapes/info-i_maps.png",
                                scaledSize: new google.maps.Size(20, 20)
                            }
                        })
                        markers.push(marker)

                        let row = document.createElement("tr")
                        row.setAttribute("data-place-id", placeId)
                        row.innerHTML = `
                            <td>${processedResults + 1}</td>
                            <td>
                                <input type="checkbox" class="acquire-checkbox" onchange="updateAcquisition(this)" ${isAcquisition ? "checked" : ""}>
                            </td>
                            <td>${place.name}</td>
                            <td>${place.formatted_address || "Alamat tidak tersedia"}</td>
                            <td class="status-cell">${isAcquisition ? "Acquired" : "Not Acquired"}</td>
                        `

                        row.classList.add(isAcquisition ? "table-success" : "table-danger")
                        tableBody.appendChild(row)

                        placesData.push({
                            id: placeId,
                            name: place.name,
                            address: place.formatted_address || "Alamat tidak tersedia",
                            latitude: place.geometry.location.lat(),
                            longitude: place.geometry.location.lng(),
                            category: category,
                            is_acquisition: isAcquisition
                        })

                        processedResults++
                    })

                    if (pagination && pagination.hasNextPage) {
                        setTimeout(() => pagination.nextPage(), 2000)
                    } else {
                        saveToDatabase(placesData)
                    }
                }

                categories[category].forEach(query => {
                    let request = {
                        query: query,
                        location: map.getCenter(),
                        radius: 1500
                    }

                    service.textSearch(request, (results, status, pagination) => {
                        if (status === google.maps.places.PlacesServiceStatus.OK) {
                            processResults(results, pagination)
                        } else {
                            console.error("Google Places API failed. Fetching from database...")
                            
                            fetch(`get_places_from_db.php?category=${category}`)
                            .then(response => response.json())
                            .then(placesFromDB => {
                                placesFromDB.forEach((place, index) => {
                                    let row = document.createElement("tr")
                                    row.setAttribute("data-place-id", place.id)
                                    row.innerHTML = `
                                        <td>${index + 1}</td>
                                        <td>
                                            <input type="checkbox" class="acquire-checkbox" onchange="updateAcquisition(this)" ${place.is_acquisition ? "checked" : ""}>
                                        </td>
                                        <td>${place.name}</td>
                                        <td>${place.address}</td>
                                        <td class="status-cell">${place.is_acquisition ? "Acquired" : "Not Acquired"}</td>
                                    `

                                    row.classList.add(place.is_acquisition ? "table-success" : "table-danger")
                                    tableBody.appendChild(row)
                                })
                            })
                            .catch(dbError => console.error("Error fetching places from database:", dbError))
                        }
                    })
                })
            })
        }

        function saveToDatabase(data) {
            fetch("save_places.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(text => { throw new Error(text) })
            }
            return response.json()
        })
        .then(result => console.log("Data berhasil disimpan:", result))
        .catch(error => console.error("Error menyimpan data:", error))
        }

        function updateAcquisition(checkbox) {
            const row = checkbox.closest("tr")
            const placeId = row.getAttribute("data-place-id")
            const statusCell = row.querySelector(".status-cell")
            
            const isAcquired = checkbox.checked ? 1 : 0
            
            fetch("update_acquisition.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ place_id: placeId, is_acquisition: isAcquired })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    if (isAcquired) {
                        row.classList.remove("table-danger")
                        row.classList.add("table-success")
                        statusCell.textContent = "Acquired"
                    } else {
                        row.classList.remove("table-success")
                        row.classList.add("table-danger")
                        statusCell.textContent = "Not Acquired"
                    }
                } else {
                    alert("Failed to update status")
                    checkbox.checked = !isAcquired
                }
            })
            .catch(error => console.error("Error updating acquisition:", error))
        }

        function getFontAwesomeMarker(iconClass, color) {
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 512 512">
                    <circle cx="256" cy="256" r="256" fill="${color}"/>
                    <text x="50%" y="50%" font-size="200" fill="white" font-family="Arial" text-anchor="middle" alignment-baseline="middle">
                        ${iconClass === "fa-utensils" ? "🍽️" :
                        iconClass === "fa-shopping-cart" ? "🛒" :
                        iconClass === "fa-bed" ? "🛏️" :
                        iconClass === "fa-building" ? "🏢" : "📍"}
                    </text>
                </svg>
            `)}`
        }
    </script>
</body>
</html>
